<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atheeg Test - Master Every Test. Ace Every Exam.</title>
  <meta name="description" content="Production-grade online quiz and exam platform with candidate registration, timed tests, proctoring, and comprehensive admin dashboard.">
  
  <!-- Google Fonts: Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
  <!-- jsPDF CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* ===== RESET & BASE STYLES ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --secondary: #ec4899;
      --accent: #22d3ee;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg-dark: #0a0e1a;
      --bg-dark-end: #131829;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(145deg, var(--bg-dark) 0%, var(--bg-dark-end) 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    h1, h2, h3, h4, h5, .brand-font {
      font-family: 'Poppins', sans-serif;
    }

    /* Selection */
    ::selection {
      background: var(--primary);
      color: #fff;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0e1a;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* App Container */
    #app-root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Micro-Animations & Utilities */
    .fade-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pulse-dot {
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* Glass Cards */
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .glass-card:hover {
      border-color: var(--card-hover-border);
    }

    .glass-nav {
      background: rgba(10, 14, 26, 0.88);
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: #e2e8f0;
    }
    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .btn-admin {
      background: linear-gradient(135deg, var(--secondary) 0%, #db2777 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.3);
    }
    .btn-admin:hover:not(:disabled) {
      background: linear-gradient(135deg, #db2777 0%, #be185d 100%);
    }
    .btn-success {
      background: var(--success);
      color: #fff;
    }

    /* Inputs */
    .form-input {
      width: 100%;
      padding: 11px 16px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-size: 13px;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Hide */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app-root">
    <!-- NAVBAR -->
    <header class="glass-nav" style="position: sticky; top: 0; z-index: 50; padding: 0 24px; height: 68px; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 14px; cursor: pointer;" onclick="AtheegApp.navigate('landing')">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #ec4899, #22d3ee); padding: 1.5px; display: flex; align-items: center; justify-content: center;">
          <div style="width: 100%; height: 100%; background: #0a0e1a; border-radius: 10.5px; display: flex; align-items: center; justify-content: center;">
            <span style="font-family: 'Poppins'; font-weight: 800; font-size: 19px; background: linear-gradient(135deg, #818cf8, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">A</span>
          </div>
        </div>
        <div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 18px; font-weight: 800; color: #fff; font-family: 'Poppins';">Atheeg<span style="color: #818cf8;">Test</span></span>
            <span style="font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 20px; background: rgba(99,102,241,0.15); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3);">PRO</span>
          </div>
          <span style="font-size: 11px; color: #94a3b8;">Master Every Test. Ace Every Exam.</span>
        </div>
      </div>

      <div id="nav-actions" style="display: flex; align-items: center; gap: 12px;">
        <!-- Dynamic actions injected via JS -->
      </div>
    </header>

    <!-- MAIN VIEW CONTAINER -->
    <main id="main-content" style="flex: 1; display: flex; flex-direction: column;">
      <!-- Views injected here dynamically -->
    </main>
  </div>

  <!-- PROCTORING WEBCAM OVERLAY (Always top-right during exam) -->
  <div id="proctor-cam-box" class="hidden" style="position: fixed; top: 80px; right: 24px; z-index: 60; background: rgba(19, 24, 41, 0.95); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(12px);">
    <div style="position: relative; width: 160px; height: 120px; background: #000; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center;">
      <video id="proctor-video" autoplay muted playsinline style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
      <div style="position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 6px; display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #ef4444;" class="pulse-dot"></span>
        <span>REC</span>
      </div>
    </div>
    <div style="margin-top: 6px; font-size: 11px; text-align: center; color: #94a3b8;">
      <i class="fa-solid fa-shield-halved" style="color: #22d3ee; margin-right: 4px;"></i> Live Proctoring Active
    </div>
  </div>

  <!-- HIDDEN SNAPSHOT CANVAS -->
  <canvas id="snapshot-canvas" width="160" height="120" style="display: none;"></canvas>

  <script>
    // Wrap in self-executing closure (no globals leak)
    (function () {
      'use strict';

      // ================================================================
      // 🔐 AUTHENTICATION RULES (CRITICAL — NEVER MODIFY CREDENTIALS)
      // ================================================================
      const ADMIN_CREDENTIALS = {
        email: "madderlachethan@gmail.com",
        password: "8008104299C"
      };

      // Storage Keys
      const KEYS = {
        CANDIDATES: 'atheeg_candidates',
        TESTS: 'atheeg_tests',
        ATTEMPTS: 'atheeg_attempts',
        SNAPSHOTS: 'atheeg_snapshots',
        EVENTS: 'atheeg_events',
        SETTINGS: 'atheeg_settings',
        ADMIN_SESSION: 'atheeg_admin_session',
        CANDIDATE_SESSION: 'atheeg_candidate_session'
      };

      // Default Pre-seeded Test & Candidate
      const SEED_TEST = {
        id: "test_gk_demo",
        title: "General Knowledge Demo",
        description: "Comprehensive assessment evaluating general sciences, computing protocols, and critical reasoning.",
        code: "ATH-GK101",
        duration: 10,
        published: true,
        createdAt: new Date().toISOString(),
        levels: [
          {
            id: "lvl_1",
            name: "Level 1: Fundamentals",
            timeLimit: 5,
            questions: [
              {
                id: "q_1",
                text: "Which planet in our solar system is widely known as the 'Red Planet'?",
                options: ["Venus", "Mars", "Jupiter", "Saturn"],
                correctIndex: 1,
                explanation: "Mars appears reddish because of widespread iron oxide on its surface.",
                difficulty: "Easy"
              },
              {
                id: "q_2",
                text: "What is the standard chemical element symbol for Gold?",
                options: ["Ag", "Au", "Fe", "Gd"],
                correctIndex: 1,
                explanation: "Au comes from the Latin word 'Aurum', meaning shining dawn.",
                difficulty: "Easy"
              },
              {
                id: "q_3",
                text: "Who published the Theory of General Relativity in 1915?",
                options: ["Isaac Newton", "Albert Einstein", "Niels Bohr", "Galileo Galilei"],
                correctIndex: 1,
                explanation: "Albert Einstein developed General Relativity, reshaping our understanding of gravity.",
                difficulty: "Medium"
              }
            ]
          },
          {
            id: "lvl_2",
            name: "Level 2: Advanced Reasoning",
            timeLimit: 5,
            questions: [
              {
                id: "q_4",
                text: "In internet networking, what does the protocol acronym 'HTTP' stand for?",
                options: [
                  "HyperText Transmission Program",
                  "HyperText Transfer Protocol",
                  "High Traffic Testing Protocol",
                  "Hybrid Terminal Transfer Pack"
                ],
                correctIndex: 1,
                explanation: "HTTP stands for HyperText Transfer Protocol, the foundation of data communication for the World Wide Web.",
                difficulty: "Medium"
              },
              {
                id: "q_5",
                text: "What is the primary cellular function of mitochondria in eukaryotic cells?",
                options: [
                  "Photosynthesis and starch creation",
                  "Cellular energy production via ATP synthesis",
                  "Ribosome assembly and RNA translation",
                  "Extracellular membrane hardening"
                ],
                correctIndex: 1,
                explanation: "Mitochondria produce the majority of cellular energy in the form of Adenosine Triphosphate (ATP).",
                difficulty: "Hard"
              }
            ]
          }
        ]
      };

      const SEED_CANDIDATE = {
        id: "cand_seed_1",
        name: "Alex Mercer",
        email: "test@atheeg.com",
        phone: "9876543210",
        // In production: hash with bcrypt on backend
        password: "test123",
        createdAt: new Date().toISOString()
      };

      // ================================================================
      // STORAGE UTILITIES
      // ================================================================
      function initStorage() {
        if (!localStorage.getItem(KEYS.TESTS)) {
          localStorage.setItem(KEYS.TESTS, JSON.stringify([SEED_TEST]));
        }
        if (!localStorage.getItem(KEYS.CANDIDATES)) {
          localStorage.setItem(KEYS.CANDIDATES, JSON.stringify([SEED_CANDIDATE]));
        }
        if (!localStorage.getItem(KEYS.ATTEMPTS)) {
          localStorage.setItem(KEYS.ATTEMPTS, JSON.stringify([]));
        }
        if (!localStorage.getItem(KEYS.SNAPSHOTS)) {
          localStorage.setItem(KEYS.SNAPSHOTS, JSON.stringify([]));
        }
        if (!localStorage.getItem(KEYS.EVENTS)) {
          localStorage.setItem(KEYS.EVENTS, JSON.stringify([]));
        }
        if (!localStorage.getItem(KEYS.SETTINGS)) {
          localStorage.setItem(KEYS.SETTINGS, JSON.stringify({ proctoringEnabled: true, theme: 'dark' }));
        }
      }

      function getCandidates() {
        try { return JSON.parse(localStorage.getItem(KEYS.CANDIDATES) || '[]'); } catch (e) { return []; }
      }
      function getTests() {
        try { return JSON.parse(localStorage.getItem(KEYS.TESTS) || '[]'); } catch (e) { return []; }
      }
      function getAttempts() {
        try { return JSON.parse(localStorage.getItem(KEYS.ATTEMPTS) || '[]'); } catch (e) { return []; }
      }

      function isAdminLoggedIn() {
        return sessionStorage.getItem(KEYS.ADMIN_SESSION) === 'true';
      }
      function getCandidateSession() {
        return sessionStorage.getItem(KEYS.CANDIDATE_SESSION);
      }
      function getCurrentCandidate() {
        const id = getCandidateSession();
        if (!id) return null;
        return getCandidates().find(c => c.id === id) || null;
      }

      // ================================================================
      // PROCTORING SYSTEM
      // ================================================================
      let mediaStream = null;
      let snapshotInterval = null;
      let currentAttemptId = null;

      function startProctoring(attemptId, onSnapSuccess) {
        currentAttemptId = attemptId;
        const video = document.getElementById('proctor-video');
        const box = document.getElementById('proctor-cam-box');
        box.classList.remove('hidden');

        // Only after explicit user click consent
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
          .then(stream => {
            mediaStream = stream;
            video.srcObject = stream;
            video.play();
          })
          .catch(err => {
            console.warn('Camera access prevented or unavailable in frame. Telemetry continues.', err);
          });

        // 30 sec snapshot loop
        snapshotInterval = setInterval(() => {
          captureSnapshot(attemptId);
        }, 30000);

        // Immediate first snapshot
        setTimeout(() => captureSnapshot(attemptId), 2000);

        // Tab switch & blur detection
        window.addEventListener('blur', logBlurEvent);
        document.addEventListener('visibilitychange', logVisibilityEvent);
      }

      function captureSnapshot(attemptId) {
        const video = document.getElementById('proctor-video');
        const canvas = document.getElementById('snapshot-canvas');
        if (!canvas) return;

        let imgData = '';
        if (video && video.videoWidth > 0) {
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, 160, 120);
          imgData = canvas.toDataURL('image/jpeg', 0.5);
        } else {
          imgData = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120"><rect width="100%" height="100%" fill="%23131829"/><text x="50%" y="50%" fill="%2322d3ee" font-size="12" font-family="sans-serif" text-anchor="middle" dy=".3em">FRAME AUDIT</text></svg>';
        }

        try {
          const snaps = JSON.parse(localStorage.getItem(KEYS.SNAPSHOTS) || '[]');
          if (snaps.length > 50) snaps.shift();
          snaps.push({ attemptId, timestamp: new Date().toISOString(), imageData: imgData });
          localStorage.setItem(KEYS.SNAPSHOTS, JSON.stringify(snaps));
        } catch (e) {
          console.warn('Snapshot quota exceeded', e);
        }
      }

      function logBlurEvent() {
        if (!currentAttemptId) return;
        logEvent(currentAttemptId, 'window_blur');
      }

      function logVisibilityEvent() {
        if (!currentAttemptId) return;
        if (document.hidden) {
          logEvent(currentAttemptId, 'tab_switch');
          alert('Proctoring Warning: Browser tab switch detected. This action is recorded in your audit log.');
        }
      }

      function logEvent(attemptId, type) {
        try {
          const events = JSON.parse(localStorage.getItem(KEYS.EVENTS) || '[]');
          events.push({ attemptId, type, timestamp: new Date().toISOString() });
          localStorage.setItem(KEYS.EVENTS, JSON.stringify(events));
        } catch (e) {}
      }

      function stopProctoring() {
        if (mediaStream) {
          mediaStream.getTracks().forEach(t => t.stop());
          mediaStream = null;
        }
        if (snapshotInterval) {
          clearInterval(snapshotInterval);
          snapshotInterval = null;
        }
        window.removeEventListener('blur', logBlurEvent);
        document.removeEventListener('visibilitychange', logVisibilityEvent);
        const box = document.getElementById('proctor-cam-box');
        if (box) box.classList.add('hidden');
        currentAttemptId = null;
      }

      // ================================================================
      // ROUTING & APP STATE
      // ================================================================
      const AtheegApp = {
        currentView: 'landing',
        activeExamTest: null,
        activeAttempt: null,

        navigate: function (view, payload) {
          this.currentView = view;
          stopProctoring();
          this.renderNav();

          const container = document.getElementById('main-content');
          container.innerHTML = '';

          switch (view) {
            case 'landing':
              this.renderLanding(container);
              break;
            case 'candidate-auth':
              this.renderCandidateAuth(container, payload || 'login');
              break;
            case 'admin-login':
              this.renderAdminLogin(container);
              break;
            case 'candidate-dashboard':
              this.renderCandidateDashboard(container);
              break;
            case 'exam-consent':
              this.renderExamConsent(container, payload);
              break;
            case 'exam-engine':
              this.renderExamEngine(container, payload);
              break;
            case 'result':
              this.renderResult(container, payload);
              break;
            case 'admin-panel':
              this.renderAdminPanel(container, payload || 'dashboard');
              break;
            default:
              this.renderLanding(container);
          }
        },

        renderNav: function () {
          const actions = document.getElementById('nav-actions');
          const candidate = getCurrentCandidate();
          const admin = isAdminLoggedIn();

          if (admin) {
            actions.innerHTML = `
              <button class="btn btn-secondary" onclick="AtheegApp.navigate('admin-panel')">
                <i class="fa-solid fa-shield-halved" style="color: #ec4899;"></i> Admin Panel
              </button>
              <button class="btn btn-secondary" onclick="AtheegApp.logoutAdmin()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
              </button>
            `;
          } else if (candidate) {
            actions.innerHTML = `
              <button class="btn btn-secondary" onclick="AtheegApp.navigate('candidate-dashboard')">
                <i class="fa-solid fa-user-check" style="color: #22d3ee;"></i> ${candidate.name}
              </button>
              <button class="btn btn-secondary" onclick="AtheegApp.logoutCandidate()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
              </button>
            `;
          } else {
            actions.innerHTML = `
              <button class="btn btn-secondary" onclick="AtheegApp.navigate('candidate-auth', 'login')">Candidate Sign In</button>
              <button class="btn btn-admin" onclick="AtheegApp.navigate('admin-login')">
                <i class="fa-solid fa-shield-halved"></i> Admin
              </button>
            `;
          }
        },

        logoutCandidate: function () {
          sessionStorage.removeItem(KEYS.CANDIDATE_SESSION);
          stopProctoring();
          this.navigate('landing');
        },

        logoutAdmin: function () {
          sessionStorage.removeItem(KEYS.ADMIN_SESSION);
          this.navigate('landing');
        },

        // ================================================================
        // VIEW 1: LANDING PAGE
        // ================================================================
        renderLanding: function (container) {
          const tests = getTests().filter(t => t.published);

          container.innerHTML = `
            <div class="fade-in" style="max-width: 1100px; margin: 0 auto; padding: 60px 24px; text-align: center;">
              <div style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 30px; background: rgba(255,255,255,0.04); border: 1px solid var(--card-border); font-size: 12px; margin-bottom: 24px;">
                <span style="width: 8px; height: 8px; border-radius: 50%; background: #10b981;" class="pulse-dot"></span>
                <span style="color: #cbd5e1; font-weight: 600;">Atheeg Test Assessment Engine Active</span>
              </div>

              <h1 style="font-size: clamp(34px, 5vw, 64px); font-weight: 800; line-height: 1.15; color: #fff; margin-bottom: 20px;">
                Master Every Test.<br>
                <span style="background: linear-gradient(135deg, #818cf8, #ec4899, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                  Ace Every Exam.
                </span>
              </h1>

              <p style="font-size: 17px; color: #94a3b8; max-width: 680px; margin: 0 auto 36px;">
                Next-generation online evaluation engine designed for institutions and candidates with multi-level testing, consent-based smart proctoring, and instant certified PDF results.
              </p>

              <!-- Quick Test Code Entry Box -->
              <div class="glass-card" style="max-width: 440px; margin: 0 auto 40px; padding: 6px; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-key" style="color: #818cf8; margin-left: 14px;"></i>
                <input id="landing-code-input" class="form-input" style="border: none; background: transparent; font-family: monospace; font-size: 14px; font-weight: 700; text-transform: uppercase;" placeholder="ENTER TEST CODE (e.g. ATH-GK101)">
                <button class="btn btn-primary" onclick="AtheegApp.handleLaunchByCode(document.getElementById('landing-code-input').value)">
                  Take Test <i class="fa-solid fa-arrow-right"></i>
                </button>
              </div>

              <!-- CTA Buttons -->
              <div style="display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 70px;">
                <button class="btn btn-primary" onclick="AtheegApp.navigate('candidate-auth')">
                  <i class="fa-solid fa-user-pen"></i> Candidate Portal
                </button>
                <button class="btn btn-admin" onclick="AtheegApp.navigate('admin-login')">
                  <i class="fa-solid fa-shield-halved"></i> Admin Login
                </button>
              </div>

              <!-- Feature Cards -->

                      <span style="font-size: 11px; padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,0.05); color: #cbd5e1;">${q.difficulty}</span>

                    <h4 style="font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 24px; line-height: 1.5;">${q.text}</h4>

                    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px;">
                      ${q.options.map((opt, optIdx) => {
                        const selected = answers[q.id] === optIdx;
                        return `
                          <div onclick="selectAnswer('${q.id}', ${optIdx})" style="padding: 14px 16px; border-radius: 12px; border: 1px solid ${selected ? '#6366f1' : 'var(--card-border)'}; background: ${selected ? 'rgba(99,102,241,0.2)' : 'rgba(0,0,0,0.3)'}; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s;">
                            <span style="width: 24px; height: 24px; border-radius: 6px; background: ${selected ? '#6366f1' : 'rgba(255,255,255,0.1)'}; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">
                              ${String.fromCharCode(65 + optIdx)}
                            </span>
                            <span style="font-size: 13px; color: ${selected ? '#fff' : '#cbd5e1'};">${opt}</span>
                          </div>
                        `;
                      }).join('')}
                    </div>

                    <!-- Nav buttons -->
                    <div style="display: flex; justify-content: space-between; align-items: center; pt-4; border-top: 1px solid var(--card-border); padding-top: 20px;">
                      <button class="btn btn-secondary" onclick="toggleMark('${q.id}')">
                        <i class="fa-solid fa-bookmark" style="color: ${isMarked ? '#a855f7' : '#94a3b8'};"></i>
                        ${isMarked ? 'Marked' : 'Mark for Review'}
                      </button>

                      <div style="display: flex; gap: 8px;">
                        <button class="btn btn-secondary" ${currentIdx === 0 ? 'disabled' : ''} onclick="prevQ()">Previous</button>
                        ${currentIdx < allQuestions.length - 1 ? `
                          <button class="btn btn-primary" onclick="nextQ()">Next</button>
                        ` : `
                          <button class="btn btn-success" onclick="finishExam()">Review &amp; Submit</button>
                        `}
                      </div>
                    </div>
                  </div>

                  <!-- Sidebar Palette -->
                  <div class="glass-card" style="padding: 24px; height: fit-content;">
                    <h4 style="font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 16px;">Question Palette</h4>
                    <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px;">
                      ${allQuestions.map((qItem, i) => {
                        const ans = answers[qItem.id] !== undefined;
                        const mrk = marked.includes(qItem.id);
                        const isCur = i === currentIdx;
                        let bg = 'rgba(255,255,255,0.05)';
                        let col = '#94a3b8';
                        if (mrk) { bg = '#a855f7'; col = '#fff'; }
                        else if (ans) { bg = '#10b981'; col = '#fff'; }
                        return `
                          <button onclick="jumpToQ(${i})" style="height: 36px; border-radius: 8px; border: ${isCur ? '2px solid #22d3ee' : 'none'}; background: ${bg}; color: ${col}; font-weight: 700; font-size: 12px; cursor: pointer;">
                            ${i + 1}
                          </button>
                        `;
                      }).join('')}
                    </div>

                    <div style="font-size: 11px; color: #94a3b8; display: flex; flex-direction: column; gap: 6px;">
                      <div><span style="display:inline-block; width:10px; height:10px; border-radius:3px; background:#10b981; margin-right:6px;"></span> Answered</div>
                      <div><span style="display:inline-block; width:10px; height:10px; border-radius:3px; background:#a855f7; margin-right:6px;"></span> Marked for Review</div>
                      <div><span style="display:inline-block; width:10px; height:10px; border-radius:3px; background:rgba(255,255,255,0.1); margin-right:6px;"></span> Unanswered</div>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }

          window.selectAnswer = function (qId, optIdx) {
            answers[qId] = optIdx;
            renderQuestion();
          };
          window.toggleMark = function (qId) {
            if (marked.includes(qId)) marked = marked.filter(x => x !== qId);
            else marked.push(qId);
            renderQuestion();
          };
          window.prevQ = function () {
            if (currentIdx > 0) { currentIdx--; renderQuestion(); }
          };
          window.nextQ = function () {
            if (currentIdx < allQuestions.length - 1) { currentIdx++; renderQuestion(); }
          };
          window.jumpToQ = function (idx) {
            currentIdx = idx;
            renderQuestion();
          };

          window.finishExam = function () {
            if (!confirm('Are you sure you want to finalize and submit your answers?')) return;
            clearInterval(timer);
            stopProctoring();

            // Calculate score
            let score = 0;
            const levelScores = test.levels.map(lvl => {
              let lCorrect = 0;
              lvl.questions.forEach(q => {
                if (answers[q.id] === q.correctIndex) {
                  lCorrect++;
                  score++;
                }
              });
              return {
                levelId: lvl.id,
                levelName: lvl.name,
                totalQuestions: lvl.questions.length,
                correctAnswers: lCorrect
              };
            });

            const pct = Math.round((score / allQuestions.length) * 100);
            const timeTaken = (test.duration * 60) - secondsLeft;

            const attemptRecord = {
              id: attemptId,
              candidateId: candidate.id,
              candidateName: candidate.name,
              candidateEmail: candidate.email,
              testId: test.id,
              testCode: test.code,
              testTitle: test.title,
              startedAt: new Date().toISOString(),
              submittedAt: new Date().toISOString(),
              answers,
              markedForReview: marked,
              score,
              totalQuestions: allQuestions.length,
              percentage: pct,
              levelScores,
              timeTaken,
              status: 'Completed',
              proctoringEventsCount: 0
            };

            const allAttempts = getAttempts();
            allAttempts.unshift(attemptRecord);
            localStorage.setItem(KEYS.ATTEMPTS, JSON.stringify(allAttempts));

            AtheegApp.navigate('result', attemptRecord);
          };

          renderQuestion();

          const timer = setInterval(() => {
            secondsLeft--;
            const timerEl = document.getElementById('exam-timer');
            if (timerEl) {
              const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
              const s = (secondsLeft % 60).toString().padStart(2, '0');
              timerEl.innerText = m + ':' + s;
            }
            if (secondsLeft <= 0) {
              clearInterval(timer);
              alert('Time has expired! Submitting test automatically.');
              window.finishExam();
            }
          }, 1000);
        },

                <div style="margin-bottom: 16px;">
                  <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Select CSV File:</label>
                  <input type="file" id="atheeg-csv-file-input" accept=".csv,text/csv" onchange="AtheegApp.handleCsvFileSelected(event)" style="width: 100%; padding: 10px; font-size: 12px; background: rgba(0,0,0,0.4); border: 1px dashed rgba(255,255,255,0.2); border-radius: 8px; color: #e2e8f0; cursor: pointer;">
                </div>

                <div style="margin-bottom: 16px;">
                  <label style="display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Or Paste Raw CSV Data:</label>
                  <textarea id="atheeg-csv-raw-input" rows="7" placeholder="Level,Question,Option A,Option B,Option C,Option D,Correct Answer,Explanation..." style="width: 100%; padding: 12px; background: #070a13; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e2e8f0; font-family: monospace; font-size: 11px; resize: vertical;"></textarea>
                </div>

                <div id="atheeg-csv-feedback" style="display: none; padding: 12px; border-radius: 8px; font-size: 12px; margin-bottom: 16px;"></div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 16px;">
                  <button class="btn" style="background: rgba(255,255,255,0.05); color: #cbd5e1;" onclick="AtheegApp.closeCsvModal()">Cancel</button>
                  <button class="btn" style="background: linear-gradient(135deg, #059669, #0d9488); color: #fff; font-weight: 700;" onclick="AtheegApp.processAndSaveCsv()">
                    <i class="fa-solid fa-bolt" style="margin-right: 6px;"></i> Convert & Create Quiz
                  </button>
                </div>
              </div>
            `;
            modal.classList.remove('hidden');
          },

          closeCsvModal: function() {
            const modal = document.getElementById('atheeg-csv-modal');
            if (modal) modal.classList.add('hidden');
          },

          loadDemoCsvInModal: function() {
            const demo = `Level,Question,Option A,Option B,Option C,Option D,Correct Answer,Explanation
Beginner,What is the primary function of an operating system?,Manage hardware and software resources,Compile Java programs,Browse the web,Host databases,A,An OS manages hardware and software resources.
Beginner,Which data structure uses LIFO (Last In First Out)?,Queue,Stack,Array,Tree,B,Stack follows Last In First Out order.
Intermediate,What is the time complexity of QuickSort in the average case?,O(n),O(n log n),O(n^2),O(log n),B,Average QuickSort complexity is O(n log n).
Intermediate,In relational databases what does ACID stand for?,Atomicity Consistency Isolation Durability,Accuracy Control Integration Data,Asynchronous Concurrent Indexing Database,Array Cluster Instance Daemon,A,ACID guarantees reliable transactions.
Advanced,What is the purpose of a Raft consensus algorithm?,Leader election and log replication,Symmetric encryption,Memory garbage collection,Packet compression,A,Raft provides distributed state machine consensus.
Advanced,Which problem is proven to be NP-Complete?,Shortest path in unweighted graph,3-SAT Boolean satisfiability,Finding maximum in an array,Merge sort,B,3-SAT is a canonical NP-complete problem.`;
            const area = document.getElementById('atheeg-csv-raw-input');
            if (area) area.value = demo;
            const feedback = document.getElementById('atheeg-csv-feedback');
            if (feedback) {
              feedback.style.display = 'block';
              feedback.style.background = 'rgba(16,185,129,0.15)';
              feedback.style.color = '#34d399';
              feedback.innerHTML = 'Pre-loaded 3 levels: Beginner (2 Qs), Intermediate (2 Qs), Advanced (2 Qs). Ready to convert!';
            }
          },

          downloadCsvTemplate: function() {
            const tpl = `Level,Question,Option A,Option B,Option C,Option D,Correct Answer,Explanation
Level 1: Fundamentals,What does HTML stand for?,Hyper Text Markup Language,High Tech Modern Language,Hyper Transfer Mode List,Home Tool Markup Language,A,HTML stands for Hyper Text Markup Language.
Level 2: Core Concepts,Which CSS property controls text size?,font-size,text-style,font-weight,text-size,A,font-size controls text magnitude.
Level 3: Advanced,What does Promise.all() do in JavaScript?,Rejects on first error or resolves all,Always runs sequentially,Cancels async actions,Binds 'this' context,A,Promise.all waits for all or rejects immediately.`;
            const blob = new Blob([tpl], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'atheeg_quiz_levels_template.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          },

          handleCsvFileSelected: function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
              const text = evt.target.result;
              const area = document.getElementById('atheeg-csv-raw-input');
              if (area) area.value = text;
              const feedback = document.getElementById('atheeg-csv-feedback');
              if (feedback) {
                feedback.style.display = 'block';
                feedback.style.background = 'rgba(34,211,238,0.15)';
                feedback.style.color = '#38bdf8';
                feedback.innerHTML = `Loaded file "${file.name}" (${(file.size / 1024).toFixed(1)} KB). Click "Convert & Create Quiz" to finalize.`;
              }
            };
            reader.readAsText(file);
          },

          processAndSaveCsv: function() {
            const raw = document.getElementById('atheeg-csv-raw-input').value.trim();
            const feedback = document.getElementById('atheeg-csv-feedback');
            if (!raw) {
              if (feedback) {
                feedback.style.display = 'block';
                feedback.style.background = 'rgba(239,68,68,0.15)';
                feedback.style.color = '#fca5a5';
                feedback.innerHTML = 'Please paste CSV content or select a CSV file first.';
              }
              return;
            }

            // Simple row/column parser
            const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length < 2) {
              if (feedback) {
                feedback.style.display = 'block';
                feedback.style.background = 'rgba(239,68,68,0.15)';
                feedback.style.color = '#fca5a5';
                feedback.innerHTML = 'CSV must contain at least a header row and 1 question row.';
              }
              return;
            }

            function parseCsvLine(line) {
              const result = [];
              let cur = '';
              let inQuotes = false;
              for (let i = 0; i < line.length; i++) {
                const c = line[i];
                if (c === '"') {
                  if (inQuotes && line[i+1] === '"') {
                    cur += '"';
                    i++;
                  } else {
                    inQuotes = !inQuotes;
                  }
                } else if (c === ',' && !inQuotes) {
                  result.push(cur.trim());
                  cur = '';
                } else {
                  cur += c;
                }
              }
              result.push(cur.trim());
              return result;
            }

            const header = parseCsvLine(lines[0]).map(h => h.toLowerCase());
            const levelIdx = header.findIndex(h => h.includes('level') || h.includes('tier') || h.includes('difficulty') || h.includes('section'));
            const qIdx = header.findIndex(h => h.includes('question') || h.includes('prompt'));
            const aIdx = header.findIndex(h => h.includes('option a') || h === 'a' || h.includes('opt a'));
            const bIdx = header.findIndex(h => h.includes('option b') || h === 'b' || h.includes('opt b'));
            const cIdx = header.findIndex(h => h.includes('option c') || h === 'c' || h.includes('opt c'));
            const dIdx = header.findIndex(h => h.includes('option d') || h === 'd' || h.includes('opt d'));
            const ansIdx = header.findIndex(h => h.includes('correct') || h.includes('answer') || h.includes('ans'));
            const expIdx = header.findIndex(h => h.includes('explanation') || h.includes('reason'));

            const levelGroups = {};

            for (let i = 1; i < lines.length; i++) {
              const cols = parseCsvLine(lines[i]);
              if (cols.length < 3) continue;

              const levelName = levelIdx !== -1 && cols[levelIdx] ? cols[levelIdx] : 'Level 1: General';
              const qText = qIdx !== -1 && cols[qIdx] ? cols[qIdx] : `Question ${i}`;
              
              const opts = [];
              if (aIdx !== -1 && cols[aIdx]) opts.push(cols[aIdx]);
              if (bIdx !== -1 && cols[bIdx]) opts.push(cols[bIdx]);
              if (cIdx !== -1 && cols[cIdx]) opts.push(cols[cIdx]);
              if (dIdx !== -1 && cols[dIdx]) opts.push(cols[dIdx]);

              if (opts.length === 0) {
                opts.push('Option A', 'Option B', 'Option C', 'Option D');
              }

              let correctIdx = 0;
              if (ansIdx !== -1 && cols[ansIdx]) {
                const ansRaw = cols[ansIdx].trim().toLowerCase();
                if (ansRaw === 'a' || ansRaw === '1' || ansRaw === 'opt a') correctIdx = 0;
                else if (ansRaw === 'b' || ansRaw === '2' || ansRaw === 'opt b') correctIdx = 1;
                else if (ansRaw === 'c' || ansRaw === '3' || ansRaw === 'opt c') correctIdx = 2;
                else if (ansRaw === 'd' || ansRaw === '4' || ansRaw === 'opt d') correctIdx = 3;
                else {
                  const found = opts.findIndex(o => o.toLowerCase().trim() === ansRaw);
                  if (found !== -1) correctIdx = found;
                }
              }

              const explanation = expIdx !== -1 && cols[expIdx] ? cols[expIdx] : `The correct answer is Option ${String.fromCharCode(65 + correctIdx)}.`;

              if (!levelGroups[levelName]) {
                levelGroups[levelName] = [];
              }

              levelGroups[levelName].push({
                id: 'q_' + Math.random().toString(36).substr(2, 9),
                text: qText,
                options: opts,
                correctAnswer: correctIdx,
                explanation: explanation
              });
            }

            const levelKeys = Object.keys(levelGroups);
            if (levelKeys.length === 0) {
              if (feedback) {
                feedback.style.display = 'block';
                feedback.style.background = 'rgba(239,68,68,0.15)';
                feedback.style.color = '#fca5a5';
                feedback.innerHTML = 'Could not parse any valid questions from the CSV. Please check formatting.';
              }
              return;
            }

            const newLevels = levelKeys.map((name, idx) => ({
              id: 'lvl_' + (idx + 1),
              name: name,
              description: `${name} stage with ${levelGroups[name].length} assessment questions.`,
              timeLimitMinutes: Math.max(2, Math.min(30, levelGroups[name].length * 1.5)),
              questions: levelGroups[name]
            }));

            const testCode = 'ATH-' + Math.random().toString(36).substring(2, 6).toUpperCase();
            const totalDuration = newLevels.reduce((acc, l) => acc + l.timeLimitMinutes, 0);

            const newTest = {
              id: 'test_' + Date.now(),
              code: testCode,
              title: 'CSV Imported Assessment (' + levelKeys.length + ' Levels)',
              description: 'Auto-structured quiz generated from CSV question bank grouped across ' + levelKeys.length + ' levels.',
              duration: Math.round(totalDuration),
              levels: newLevels,
              published: true,
              createdAt: new Date().toISOString()
            };

            const existingTests = JSON.parse(localStorage.getItem('atheeg_tests') || '[]');
            existingTests.push(newTest);
            localStorage.setItem('atheeg_tests', JSON.stringify(existingTests));

            AtheegApp.closeCsvModal();
            alert('Quiz Successfully Created!\\n\\nTitle: ' + newTest.title + '\\nTest Code: ' + newTest.code + '\\nLevels: ' + newLevels.length + '\\nTotal Questions: ' + newLevels.reduce((a, l) => a + l.questions.length, 0));
            AtheegApp.navigate('admin-panel', 'tests');
          }
        }
      };

      // Bootstrap
      initStorage();
      window.AtheegApp = AtheegApp;
      AtheegApp.navigate('landing');
    })();
  </script>
</body>
</html>
